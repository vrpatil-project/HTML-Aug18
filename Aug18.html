<!DOCTYPE html>
<html>
<head>
    <title>Containers</title>

    <style>
        .container1 {
            width: 400px;
            height: 200px;
            border: 2px solid black;
            background-color: rgb(204, 248, 204);
        }
        .container2 {
            width: 400px;
            height: 200px;
            border: 2px solid black;
            background-color: rgb(204, 248, 204);
        }
        .container3 {
            width: 400px;
            height: 200px;
            border: 2px solid black;
            background-color: rgb(248, 204, 204);
        }
        .container4 {
            width: 400px;
            height: 200px;
            border: 2px solid black;
            background-color: rgb(227, 204, 248);
        }

    </style>
</head>

<body>
 <h1>Containers</h1>
    <table>
        <tr>
            <td>
                <div class="container1">
                    <h1>HTML</h1>
                    <p>HTML is used to create web pages.</p>
                </div>
            </td>

            <td>
                <div class="container2">
                    <h1>CSS</h1>
                    <p>CSS is used to style web pages.</p>
                </div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="container3">
                    <h1>Inline CSS</h1>
                    <p>CSS written inside the HTML tag.</p>
                </div>
            </td>

            <td>
                <div class="container4">
                    <h1>External CSS</h1>
                    <p>CSS written in a separate CSS file.</p>
                </div>
            </td>
        </tr>
    </table>

</body>
</html>
